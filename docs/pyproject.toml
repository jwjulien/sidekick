[tool.poetry]
name = "sidekick-docs"
version = "0.1.0"
description = "Documentation report generator and indexer for Sidekick Inventory Manager"
authors = ["Sidekick Developer"]
package-mode = false

[tool.poetry.dependencies]
python = "^3.10"
pyyaml = "^6.0.1"
markdown = "^3.6"
jinja2 = "^3.1.3"
pymdown-extensions = "^10.8"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
